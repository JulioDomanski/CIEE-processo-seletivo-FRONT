<div class="container">
  <h1>Cadastro de Currículo</h1>
  <form (ngSubmit)="cadastrar()">
    <div>
      <label for="nome">Nome completo *</label>
      <input
        id="nome"
        type="text"
        name="nomeCompleto"
        [(ngModel)]="curriculo.nomeCompleto"
        required
        maxlength="90"
      >
    </div>
    <div>
      <label for="email">E-mail *</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="curriculo.email"
        required
      >
    </div>
    <div>
      <label for="telefone">Telefone</label>
      <input
        id="telefone"
        type="tel"
        name="telefone"
        [(ngModel)]="curriculo.telefone"
      >
    </div>
    <div>
      <label for="area">Área ou cargo de interesse</label>
      <input
        id="area"
        type="text"
        name="areaInteresse"
        [(ngModel)]="curriculo.areaInteresse"
      >
    </div>
    <div>
      <label for="resumo">Resumo profissional</label>
      <textarea
        id="resumo"
        name="resumoProfissional"
        [(ngModel)]="curriculo.resumoProfissional"
      ></textarea>
    </div>
    <div>
    <label for="curriculoPdf">Anexar currículo em PDF</label>

    <input
      id="curriculoPdf"
      type="file"
      accept="application/pdf"
      (change)="selecionarPdf($event)"
    >
  </div>
    <button type="submit">
      Cadastrar currículo
    </button>
  </form>
</div>
